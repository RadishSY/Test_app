<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- ===== 登录/注册 ===== -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>👋 聊天室</h1>
      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <input type="text" id="login-username" placeholder="用户名" maxlength="20" required>
        <input type="password" id="login-password" placeholder="密码" required>
        <p class="auth-msg" id="login-msg"></p>
        <button type="submit">登录</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-username" placeholder="用户名" maxlength="20" required>
        <input type="password" id="reg-password" placeholder="密码（至少 4 位）" required>
        <input type="text" id="reg-nickname" placeholder="显示名称（选填）" maxlength="20">
        <p class="auth-msg" id="reg-msg"></p>
        <button type="submit">注册</button>
      </form>
    </div>
  </div>

  <!-- ===== 聊天界面 ===== -->
  <div id="chat-screen" class="screen hidden">
    <div class="chat-container">
      <!-- 侧边栏 -->
      <aside class="sidebar">
        <div class="sidebar-user">
          <div class="sidebar-user-info" id="profile-btn">
            <div class="sidebar-avatar" id="sidebar-avatar">
              <span class="sidebar-avatar-letter" id="sidebar-avatar-letter"></span>
              <img id="sidebar-avatar-img" class="hidden" alt="">
            </div>
            <span id="sidebar-nickname"></span>
          </div>
          <button id="logout-btn">退出</button>
        </div>

        <!-- 侧边栏 tabs -->
        <div class="sidebar-tabs">
          <button class="s-tab active" data-stab="online">在线 <span id="online-count"></span></button>
          <button class="s-tab" data-stab="friends">好友</button>
        </div>

        <!-- 在线用户列表 -->
        <div id="online-panel" class="stab-panel">
          <ul id="user-list"></ul>
        </div>

        <!-- 好友面板 -->
        <div id="friends-panel" class="stab-panel hidden">
          <button id="add-friend-btn" class="btn-small">＋ 添加好友</button>
          <div id="friend-requests" class="hidden">
            <h4>待处理请求</h4>
            <ul id="request-list"></ul>
          </div>
          <ul id="friend-list"></ul>
          <p id="no-friends" class="empty-hint">还没有好友</p>
        </div>

        <!-- 添加好友弹窗 -->
        <div id="add-friend-modal" class="modal hidden">
          <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>添加好友</h3>
            <input type="text" id="search-user-input" placeholder="搜索用户名或昵称...">
            <ul id="search-results"></ul>
            <p id="search-empty" class="empty-hint hidden">输入关键词搜索用户</p>
          </div>
        </div>

        <!-- 个人资料弹窗 -->
        <div id="profile-modal" class="modal hidden">
          <div class="modal-content profile-modal">
            <span class="modal-close" id="profile-close">&times;</span>
            <h3>个人资料</h3>

            <!-- 查看模式 -->
            <div id="profile-view">
              <div class="profile-avatar-wrap" id="profile-avatar-upload">
                <div class="profile-avatar" id="profile-avatar-display">
                  <span class="profile-avatar-letter" id="profile-avatar-letter"></span>
                  <img id="profile-avatar-img" class="hidden" alt="头像">
                  <div class="profile-avatar-overlay">更换头像</div>
                </div>
              </div>
              <div class="profile-nickname" id="profile-nickname-view"></div>
              <div class="profile-username" id="profile-username-view"></div>
              <div class="profile-divider"></div>
              <div class="profile-field">
                <span class="profile-field-label">个性签名</span>
                <p class="profile-field-value" id="profile-signature-view">未设置</p>
              </div>
              <div class="profile-field">
                <span class="profile-field-label">个人简介</span>
                <p class="profile-field-value" id="profile-bio-view">未设置</p>
              </div>
              <button class="profile-edit-btn" id="profile-edit-btn">编辑资料</button>
            </div>

            <!-- 编辑模式 -->
            <div id="profile-edit" class="hidden">
              <div class="profile-avatar-wrap" id="profile-avatar-edit-trigger">
                <div class="profile-avatar" id="profile-avatar-display-edit">
                  <span class="profile-avatar-letter" id="profile-avatar-letter-edit"></span>
                  <img id="profile-avatar-img-edit" class="hidden" alt="头像">
                  <div class="profile-avatar-overlay">更换头像</div>
                </div>
              </div>
              <div class="profile-nickname" id="profile-nickname-edit-label"></div>
              <div class="profile-username" id="profile-username-edit-label"></div>
              <div class="profile-divider"></div>
              <div class="profile-field">
                <span class="profile-field-label">显示名称</span>
                <input type="text" class="profile-input" id="profile-nickname-input" maxlength="20">
              </div>
              <div class="profile-field">
                <span class="profile-field-label">个性签名</span>
                <input type="text" class="profile-input" id="profile-signature-input" maxlength="200" placeholder="介绍一下自己...">
              </div>
              <div class="profile-field">
                <span class="profile-field-label">个人简介</span>
                <textarea class="profile-textarea" id="profile-bio-input" maxlength="500" placeholder="关于我..." rows="3"></textarea>
              </div>
              <div class="profile-edit-actions">
                <button class="profile-save-btn" id="profile-save-btn">保存</button>
                <button class="profile-cancel-btn" id="profile-cancel-btn">取消</button>
              </div>
            </div>

            <form id="profile-avatar-form" hidden>
              <input type="file" id="profile-avatar-file" accept="image/*">
            </form>
          </div>
        </div>
      </aside>

      <!-- 主区域 -->
      <main class="main">
        <!-- 公共聊天 -->
        <div id="public-chat">
          <header class="chat-header">
            <h2>公共聊天室</h2>
          </header>
          <div id="messages" class="messages"></div>
          <div class="typing-indicator" id="typing-indicator"></div>
          <form id="message-form" class="input-area">
            <input type="text" id="message-input" placeholder="输入消息..." autocomplete="off">
            <div class="input-tools">
              <button type="button" class="tool-btn emoji-btn" data-target="message-input" title="表情">😊</button>
              <button type="button" class="tool-btn upload-btn" data-target="message-form" title="发送图片">📷</button>
              <input type="file" class="file-input" accept="image/*" hidden>
            </div>
            <button type="submit">发送</button>
          </form>
        </div>

        <!-- 私聊 -->
        <div id="private-chat" class="hidden">
          <header class="chat-header private-header">
            <button id="back-to-public" class="back-btn">&larr; 返回</button>
            <h2>与 <span id="private-friend-name"></span> 私聊</h2>
          </header>
          <div id="private-messages" class="messages"></div>
          <div class="typing-indicator" id="private-typing"></div>
          <form id="private-form" class="input-area">
            <input type="text" id="private-input" placeholder="输入私聊消息..." autocomplete="off">
            <div class="input-tools">
              <button type="button" class="tool-btn emoji-btn" data-target="private-input" title="表情">😊</button>
              <button type="button" class="tool-btn upload-btn" data-target="private-form" title="发送图片">📷</button>
              <input type="file" class="file-input" accept="image/*" hidden>
            </div>
            <button type="submit">发送</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <!-- ===== Emoji 选择器 ===== -->
  <div id="emoji-picker" class="emoji-picker hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
